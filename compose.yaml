name: koshsetu-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: koshsetu
      POSTGRES_USER: koshsetu
      POSTGRES_PASSWORD: local-demo-only-change-me
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koshsetu -d koshsetu"]
      interval: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-demo
      MINIO_ROOT_PASSWORD: local-demo-only-change-me
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 local-demo local-demo-only-change-me; do sleep 2; done
        mc mb --ignore-existing local/koshsetu-private
        mc anonymous set none local/koshsetu-private
  api:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      KOSHSETU_ENVIRONMENT: local
      KOSHSETU_DATABASE_URL: postgresql+psycopg://koshsetu:local-demo-only-change-me@postgres:5432/koshsetu?sslmode=disable
      KOSHSETU_STORAGE_BACKEND: minio
      KOSHSETU_MINIO_ENDPOINT: http://minio:9000
      KOSHSETU_AUTO_CREATE_SCHEMA: "false"
      KOSHSETU_OCR_ENABLED: "true"
      KOSHSETU_OCR_LANGUAGES: eng+hin
    ports: ["127.0.0.1:8001:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    environment:
      VITE_API_TARGET: http://api:8000
    ports: ["127.0.0.1:5180:5173"]
volumes:
  postgres-data:
  minio-data:
