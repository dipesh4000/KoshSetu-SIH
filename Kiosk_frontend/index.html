function showTimeoutModal(){
  if($('#timeoutModal')) return;
  overlaysEl.insertAdjacentHTML('beforeend',`
    <div class="modal-scrim" id="timeoutModal"><div class="tmodal">
      <div class="ringwrap"><svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="var(--bg-base)" stroke-width="9"/>
        <circle id="tmRing" cx="60" cy="60" r="52" fill="none" stroke="var(--accent-brass)" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
        <div class="ringnum" id="tmNum">10</div></div>
      <h2 class="t-h2s" style="margin:0">Still exploring?</h2>
      <p class="t-bodyl" style="margin:10px 0 0;color:var(--text-secondary)">Returning to the start in <span id="tmSec">10</span> seconds</p>
      <button class="btn-primary" style="width:100%;margin-top:20px" id="tmStay">I'm still here</button>
    </div></div>`);
  $('#tmStay').addEventListener('click',()=>{ resetIdle(); toast('Session extended'); });
  const iv=setInterval(()=>{
    const m=$('#timeoutModal'); if(!m){ clearInterval(iv); return; }
    const left=Math.max(0,Math.ceil(90-(Date.now()-idleT0)/1000));
    const r=$('#tmRing'); if(r) r.setAttribute('stroke-dashoffset',326.7*(1-left/10));
    const n=$('#tmNum'), s=$('#tmSec');
    if(n) n.textContent=left; if(s) s.textContent=left;
  },200);
}
function openA11y(){
  if($('#a11yDrawer')) return;
  const pcts=['85%','100%','118%','136%'];
  overlaysEl.insertAdjacentHTML('beforeend',`
    <div class="ov-scrim" id="a11yScrim" style="z-index:74"></div>
    <div class="a11y-drawer" id="a11yDrawer">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2 class="t-h2s" style="margin:0">Accessibility</h2>
        <button class="btn-icon sm" id="a11yClose">${svg(IC.close,22,1.8)}</button></div>
      <div><div class="a11y-label">Text size</div>
        <div style="display:flex;align-items:center;gap:16px">
          <button class="step-btn" id="aDown">A−</button>
          <span class="tlab" id="aPct" style="min-width:56px;text-align:center">${pcts[STATE.a11y.step]}</span>
          <button class="step-btn" id="aUp">A+</button></div></div>
      <div><div class="a11y-label">Appearance — light suits a bright gallery, dark suits a dim one</div>
        <div class="contrastseg">
          <button id="aDark" aria-pressed="${STATE.a11y.mode==='dark'}">Dark</button>
          <button id="aLight" aria-pressed="${STATE.a11y.mode==='light'}">Light</button></div></div>
      <div><div class="a11y-label">Contrast</div>
        <div class="contrastseg">
          <button id="aStd" aria-pressed="${!STATE.a11y.hc}">Standard</button>
          <button id="aHc" aria-pressed="${STATE.a11y.hc}">High contrast</button></div></div>
      <div><div class="a11y-label">Screen height — shifts the whole interface down for wheelchair users and children</div>
        <div class="htrack" id="aTrack"><div class="hhandle" id="aHandle"></div></div>
        <div class="hends"><span>Standing</span><span>Lowered</span></div></div>
      <p style="margin:auto 0 0;font-size:13px;line-height:20px;color:var(--text-muted)">Settings apply to the whole kiosk and reset when the session returns to the attract screen.</p>
    </div>`);
  const applyA=()=>{
    document.documentElement.style.setProperty('--ui-scale',[0.85,1,1.18,1.36][STATE.a11y.step]);
    document.documentElement.style.setProperty('--ui-shift',(STATE.a11y.height*40)+'px');
    document.documentElement.classList.toggle('hc',STATE.a11y.hc);
    document.documentElement.setAttribute('data-mode',STATE.a11y.mode);
    $('#aPct').textContent=pcts[STATE.a11y.step];
    $('#aStd').setAttribute('aria-pressed',String(!STATE.a11y.hc));
    $('#aDark').setAttribute('aria-pressed',String(STATE.a11y.mode==='dark'));
    $('#aLight').setAttribute('aria-pressed',String(STATE.a11y.mode==='light'));
    var rb=document.getElementById('rbMode'); if(rb) rb.textContent='Mode: '+STATE.a11y.mode;
    $('#aHc').setAttribute('aria-pressed',String(STATE.a11y.hc));
    const t=$('#aTrack'); if(t) $('#aHandle').style.left=(6+(STATE.a11y.height/3)*(t.clientWidth-56))+'px';
  };
  $('#a11yClose').addEventListener('click',()=>{['a11yDrawer','a11yScrim'].forEach(i=>{const e=$('#'+i);if(e)e.remove();});});
  $('#a11yScrim').addEventListener('click',()=>{['a11yDrawer','a11yScrim'].forEach(i=>{const e=$('#'+i);if(e)e.remove();});});
  $('#aDown').addEventListener('click',()=>{ if(STATE.a11y.step>0){STATE.a11y.step--;applyA();} });
  $('#aUp').addEventListener('click',()=>{ if(STATE.a11y.step<3){STATE.a11y.step++;applyA();} });
  $('#aDark').addEventListener('click',()=>{ STATE.a11y.mode='dark'; applyA(); toast('Dark mode'); });
  $('#aLight').addEventListener('click',()=>{ STATE.a11y.mode='light'; applyA(); toast('Light mode'); });
  $('#aStd').addEventListener('click',()=>{ STATE.a11y.hc=false; applyA(); });
  $('#aHc').addEventListener('click',()=>{ STATE.a11y.hc=true; applyA(); });
  $('#aTrack').addEventListener('click',e=>{
    const r=$('#aTrack').getBoundingClientRect();
    STATE.a11y.height=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left-28)/(r.width-56)))*3);
    applyA(); toast('Screen height: stop '+(STATE.a11y.height+1)+' of 4');
  });
  applyA();
}

$('#reviewbar').addEventListener('click', e=>{
  const b=e.target.closest('.rb-btn'); if(!b) return;
  if(b.dataset.go){
    const p = b.dataset.go==='detail' ? {id:(ITEMS[0]||{}).id}
            : b.dataset.go==='browse' ? {cat:(CATEGORIES[0]||{}).id}
            : b.dataset.go==='related' ? {id:'amb'}
            : b.dataset.go==='aiviewer' ? {id:AI_FEATURE.id} : {};
    go(b.dataset.go, p);
  }
  if(b.id==='rbApi'){ b.textContent='API: connecting…'; connect(); }
  if(b.id==='rbOffline'){
    STATE.forceOffline=!STATE.forceOffline;
    b.textContent='Offline: '+(STATE.forceOffline?'on':'off');
    b.classList.toggle('active',STATE.forceOffline);
    STATE.offline = STATE.forceOffline || !STATE.live;
    apiBadge(); go(STATE.screen,STATE.params,{noHistory:true});
  }
  if(b.id==='rbIdle'){ STATE.idleOn=!STATE.idleOn; b.textContent='Idle timer: '+(STATE.idleOn?'on':'off'); b.classList.toggle('active',!STATE.idleOn); resetIdle(); }
  if(b.id==='rbMode'){
    STATE.a11y.mode = STATE.a11y.mode==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-mode',STATE.a11y.mode);
    b.textContent='Mode: '+STATE.a11y.mode;
    var d=document.getElementById('aDark'), l=document.getElementById('aLight');
    if(d){ d.setAttribute('aria-pressed',String(STATE.a11y.mode==='dark')); l.setAttribute('aria-pressed',String(STATE.a11y.mode==='light')); }
  }
  if(b.id==='rbA11y'){ openA11y(); }
});

document.documentElement.setAttribute('data-mode',STATE.a11y.mode);
