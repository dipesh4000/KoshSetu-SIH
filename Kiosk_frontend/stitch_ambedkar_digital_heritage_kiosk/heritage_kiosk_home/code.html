<body class="bg-surface text-on-surface font-body-md h-full overflow-hidden flex flex-col selection:bg-tertiary/30 selection:text-primary relative">
<!-- Top App Bar (Attract Mode / Idle indicator) -->
<header class="bg-surface dark:bg-surface text-primary dark:text-on-surface font-headline-md text-headline-md font-semibold docked full-width top-0 border-b-2 border-tertiary/20 flex justify-between items-center w-full px-margin-kiosk h-touch-lg absolute z-20 bg-opacity-80 backdrop-blur-sm">
<div class="flex items-center gap-4">

</div>
<div>

<div class="w-full h-full bg-tertiary animate-[pulse_2s_ease-in-out_infinite] origin-left"></div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex relative w-full h-full">
<!-- Full-height High-Contrast Portrait Placeholder -->

<div class="absolute inset-0 bg-gradient-to-r from-surface via-transparent to-surface/20"></div>
</div>

                    "History is not a burden on the memory but an illumination of the soul."
                </blockquote>
<!-- Subtitle / Context -->

<div class="w-12 h-0.5 bg-tertiary"></div>
<p class="font-headline-md text-headline-md text-secondary">
                        The National Archive Collection
                    </p>
</div>
